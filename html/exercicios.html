    <h1>Alguns exercicios para praticas</h1>

    <h2>IF/ELSE e ELSE IF</h2>
    <p>Eleições</p>
   <div style="font-size: 30px;">
    Digite a sua idade:<input type="number" id="idade" class="idade"> <br>
   <input type="button" value="Resultado" onclick="eleicoes()">
    <p id="resultadoEleicoes" class="resultadoEleicoes"></p>


    <p>Outra forma</p>

    Digite o dia de nascimento: <input type="number" id="dia" class="dia" min="1" max="31" placeholder="Ex:6"><br>
    Digite o mes de nascimento: <input type="number" id="mes" class="mes" min="1" max="12" placeholder="Ex:7"><br>
    Digite o ano de nascimento: <input type="number" id="ano" class="ano" min="1967" max="6767" placeholder="1967"><br>
    <input type="button" value="Saber a sua Idade" onclick="idadeExata()">
    <p id="resultadoIdade"></p><br>
</div>



    <h2>For IN - Tabuada</h2>
<div style="font-size: 30px;">
    Escolha um Numero: <input type="number" id="n" class="n" min="1"><br>
    Quantas vezes quer que multiplique? : <input type="number" id="y" class="y" max="20">
    <input type="button" value="Calcular" onclick="tabuada()">
    <p id="resultadoTabuada"></p>

    <a style="font-size: 30px;" href="../index.html">Voltar</a>
    </div>
    
</body>
